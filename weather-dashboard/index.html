<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap');
    
    * {
      font-family: 'Inter', sans-serif;
    }
    
    h1, h2, h3 {
      font-family: 'Poppins', sans-serif;
    }

    .weather-card {
      transition: all 0.3s ease;
    }

    .weather-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
    }

    .loader {
      border: 4px solid rgba(59, 130, 246, 0.1);
      border-radius: 50%;
      border-top: 4px solid #3b82f6;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .temperature-display {
      font-size: 4rem;
      font-weight: 700;
      line-height: 1;
    }

    .forecast-item {
      transition: all 0.2s ease;
    }

    .forecast-item:hover {
      transform: scale(1.05);
    }

    .gradient-bg-warm {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .gradient-bg-cool {
      background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
    }

    .gradient-bg-hot {
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
    }

    .gradient-bg-rainy {
      background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
    }

    .grid-cols-auto {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }

    .weather-icon {
      font-size: 4rem;
      text-align: center;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-cyan-50 to-blue-100 min-h-screen">
  <div id="root"></div>

  <script type="module">
    const { useState, useEffect } = React;

    // Weather Dashboard Component
    function WeatherDashboard() {
      const [weather, setWeather] = useState(null);
      const [forecast, setForecast] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [city, setCity] = useState('London');
      const [searchInput, setSearchInput] = useState('');
      const [unit, setUnit] = useState('metric'); // 'metric' for Celsius, 'imperial' for Fahrenheit
      const [savedCities, setSavedCities] = useState([]);

      const API_KEY = 'b6fd43b5a86f42c6a93304255241512'; // Free API from weatherapi.com

      // Load saved cities from localStorage
      useEffect(() => {
        const saved = localStorage.getItem('weatherDashboardCities');
        if (saved) {
          setSavedCities(JSON.parse(saved));
        }
      }, []);

      // Save cities to localStorage
      useEffect(() => {
        localStorage.setItem('weatherDashboardCities', JSON.stringify(savedCities));
      }, [savedCities]);

      // Fetch weather data
      const fetchWeather = async (searchCity = city) => {
        setLoading(true);
        setError(null);

        try {
          const response = await fetch(
            `https://api.weatherapi.com/v1/forecast.json?key=${API_KEY}&q=${searchCity}&days=7&aqi=yes`
          );

          if (!response.ok) {
            throw new Error('City not found. Please try another location.');
          }

          const data = await response.json();
          
          setWeather({
            city: data.location.name,
            country: data.location.country,
            region: data.location.region,
            temp: Math.round(data.current.temp_c),
            tempF: Math.round(data.current.temp_f),
            condition: data.current.condition.text,
            icon: data.current.condition.icon,
            humidity: data.current.humidity,
            windSpeed: data.current.wind_kph,
            windSpeedMph: data.current.wind_mph,
            feelsLike: Math.round(data.current.feelslike_c),
            feelsLikeF: Math.round(data.current.feelslike_f),
            pressure: data.current.pressure_mb,
            visibility: data.current.vis_km,
            uvIndex: data.current.uv,
            precipitation: data.current.precip_mm,
            lastUpdated: data.current.last_updated,
          });

          // Process forecast data
          const forecastData = data.forecast.forecastday.map((day, index) => ({
            date: day.date,
            dayOfWeek: new Date(day.date).toLocaleDateString('en-US', { weekday: 'short' }),
            maxTemp: Math.round(day.day.maxtemp_c),
            maxTempF: Math.round(day.day.maxtemp_f),
            minTemp: Math.round(day.day.mintemp_c),
            minTempF: Math.round(day.day.mintemp_f),
            condition: day.day.condition.text,
            icon: day.day.condition.icon,
            humidity: day.day.avg_humidity,
            windSpeed: day.day.maxwind_kph,
            precipitation: day.day.daily_chance_of_rain,
          }));

          setForecast(forecastData);
          setCity(data.location.name);
        } catch (err) {
          setError(err.message);
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      // Handle search
      const handleSearch = (e) => {
        e.preventDefault();
        if (searchInput.trim()) {
          fetchWeather(searchInput.trim());
          setSearchInput('');
        }
      };

      // Add city to saved cities
      const addToSavedCities = () => {
        if (weather && !savedCities.includes(weather.city)) {
          setSavedCities([...savedCities, weather.city]);
        }
      };

      // Remove from saved cities
      const removeFromSavedCities = (cityName) => {
        setSavedCities(savedCities.filter(c => c !== cityName));
      };

      // Load initial weather
      useEffect(() => {
        fetchWeather();
      }, []);

      // Get weather gradient based on condition
      const getWeatherGradient = (condition) => {
        if (condition.toLowerCase().includes('rain') || condition.toLowerCase().includes('drizzle')) {
          return 'gradient-bg-rainy';
        } else if (condition.toLowerCase().includes('cloud')) {
          return 'gradient-bg-cool';
        } else if (condition.toLowerCase().includes('sunny') || condition.toLowerCase().includes('clear')) {
          return 'gradient-bg-hot';
        } else {
          return 'gradient-bg-warm';
        }
      };

      const isCelsius = unit === 'metric';

      return (
        <div className="min-h-screen p-4 md:p-8">
          <div className="max-w-6xl mx-auto">
            {/* Header */}
            <div className="text-center mb-8">
              <h1 className="text-4xl md:text-5xl font-bold text-gray-800 mb-2">
                ☁️ Weather Dashboard
              </h1>
              <p className="text-gray-600 text-lg">Real-time weather information for any location</p>
            </div>

            {/* Search Bar */}
            <div className="bg-white rounded-2xl shadow-lg p-6 mb-6">
              <form onSubmit={handleSearch} className="flex flex-col sm:flex-row gap-4 mb-4">
                <input
                  type="text"
                  value={searchInput}
                  onChange={(e) => setSearchInput(e.target.value)}
                  placeholder="Search for a city..."
                  className="flex-1 px-4 py-3 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-blue-500 font-medium"
                />
                <button
                  type="submit"
                  disabled={loading}
                  className="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-semibold transition transform hover:scale-105 disabled:opacity-50"
                >
                  🔍 Search
                </button>
              </form>

              {/* Temperature Unit Toggle */}
              <div className="flex items-center justify-between">
                <div className="flex gap-2">
                  <button
                    onClick={() => setUnit('metric')}
                    className={`px-4 py-2 rounded-lg font-semibold transition ${
                      unit === 'metric'
                        ? 'bg-blue-600 text-white'
                        : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                    }`}
                  >
                    °C
                  </button>
                  <button
                    onClick={() => setUnit('imperial')}
                    className={`px-4 py-2 rounded-lg font-semibold transition ${
                      unit === 'imperial'
                        ? 'bg-blue-600 text-white'
                        : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                    }`}
                  >
                    °F
                  </button>
                </div>
              </div>
            </div>

            {/* Error Message */}
            {error && (
              <div className="bg-red-100 border-2 border-red-400 text-red-700 px-6 py-4 rounded-lg mb-6">
                ⚠️ {error}
              </div>
            )}

            {/* Loading State */}
            {loading && (
              <div className="flex justify-center items-center py-12">
                <div className="loader"></div>
                <span className="ml-4 text-gray-600 font-semibold">Loading weather data...</span>
              </div>
            )}

            {/* Current Weather */}
            {weather && !loading && (
              <>
                <div className={`weather-card ${getWeatherGradient(weather.condition)} rounded-2xl shadow-2xl p-8 md:p-12 text-white mb-8`}>
                  <div className="grid md:grid-cols-2 gap-8">
                    {/* Left Side */}
                    <div>
                      <h2 className="text-3xl md:text-4xl font-bold mb-2">
                        {weather.city}, {weather.country}
                      </h2>
                      <p className="text-blue-100 mb-6 text-lg">{weather.region}</p>
                      
                      <div className="flex items-center gap-4 mb-6">
                        <img src={weather.icon} alt={weather.condition} className="w-24 h-24" />
                        <div>
                          <div className="temperature-display">
                            {isCelsius ? weather.temp : weather.tempF}°
                          </div>
                          <p className="text-xl">{weather.condition}</p>
                        </div>
                      </div>

                      <p className="text-blue-100 text-lg">
                        Feels like {isCelsius ? weather.feelsLike : weather.feelsLikeF}°
                      </p>
                    </div>

                    {/* Right Side - Weather Details */}
                    <div>
                      <div className="grid grid-cols-2 gap-4">
                        <div className="bg-white bg-opacity-20 rounded-lg p-4">
                          <p className="text-blue-100 text-sm mb-1">Humidity</p>
                          <p className="text-2xl font-bold">{weather.humidity}%</p>
                        </div>
                        <div className="bg-white bg-opacity-20 rounded-lg p-4">
                          <p className="text-blue-100 text-sm mb-1">Wind Speed</p>
                          <p className="text-2xl font-bold">
                            {isCelsius ? weather.windSpeed : weather.windSpeedMph}
                            <span className="text-sm"> {isCelsius ? 'km/h' : 'mph'}</span>
                          </p>
                        </div>
                        <div className="bg-white bg-opacity-20 rounded-lg p-4">
                          <p className="text-blue-100 text-sm mb-1">Pressure</p>
                          <p className="text-2xl font-bold">{weather.pressure} mb</p>
                        </div>
                        <div className="bg-white bg-opacity-20 rounded-lg p-4">
                          <p className="text-blue-100 text-sm mb-1">Visibility</p>
                          <p className="text-2xl font-bold">{Math.round(weather.visibility)} km</p>
                        </div>
                        <div className="bg-white bg-opacity-20 rounded-lg p-4">
                          <p className="text-blue-100 text-sm mb-1">UV Index</p>
                          <p className="text-2xl font-bold">{Math.round(weather.uvIndex)}</p>
                        </div>
                        <div className="bg-white bg-opacity-20 rounded-lg p-4">
                          <p className="text-blue-100 text-sm mb-1">Precipitation</p>
                          <p className="text-2xl font-bold">{weather.precipitation} mm</p>
                        </div>
                      </div>

                      <button
                        onClick={addToSavedCities}
                        disabled={savedCities.includes(weather.city)}
                        className={`w-full mt-4 px-4 py-3 rounded-lg font-semibold transition ${
                          savedCities.includes(weather.city)
                            ? 'bg-white bg-opacity-30 text-white cursor-default'
                            : 'bg-white text-blue-600 hover:bg-opacity-90'
                        }`}
                      >
                        {savedCities.includes(weather.city) ? '⭐ Saved' : '☆ Save City'}
                      </button>
                    </div>
                  </div>

                  <p className="text-blue-100 text-sm mt-6">
                    Last updated: {new Date(weather.lastUpdated).toLocaleString()}
                  </p>
                </div>

                {/* 7-Day Forecast */}
                <div className="mb-8">
                  <h3 className="text-2xl font-bold text-gray-800 mb-4">7-Day Forecast</h3>
                  <div className="grid-cols-auto">
                    {forecast.map((day, index) => (
                      <div
                        key={index}
                        className="forecast-item bg-white rounded-xl shadow-md p-4 hover:shadow-lg"
                      >
                        <p className="font-semibold text-gray-800 mb-2">{day.dayOfWeek}</p>
                        <p className="text-sm text-gray-500 mb-3">{new Date(day.date).toLocaleDateString()}</p>
                        
                        <img src={day.icon} alt={day.condition} className="w-16 h-16 mx-auto mb-3" />
                        
                        <p className="text-sm text-gray-600 text-center mb-3">{day.condition}</p>
                        
                        <div className="bg-gray-50 rounded-lg p-3 mb-3">
                          <p className="text-lg font-bold text-gray-800">
                            {isCelsius ? day.maxTemp : day.maxTempF}°
                          </p>
                          <p className="text-sm text-gray-500">
                            {isCelsius ? day.minTemp : day.minTempF}°
                          </p>
                        </div>

                        <div className="space-y-2 text-sm">
                          <div className="flex justify-between text-gray-600">
                            <span>💧 Humidity:</span>
                            <span className="font-semibold">{Math.round(day.humidity)}%</span>
                          </div>
                          <div className="flex justify-between text-gray-600">
                            <span>💨 Wind:</span>
                            <span className="font-semibold">{Math.round(day.windSpeed)} {isCelsius ? 'km/h' : 'mph'}</span>
                          </div>
                          <div className="flex justify-between text-gray-600">
                            <span>🌧️ Rain:</span>
                            <span className="font-semibold">{day.precipitation}%</span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Saved Cities */}
                {savedCities.length > 0 && (
                  <div>
                    <h3 className="text-2xl font-bold text-gray-800 mb-4">⭐ Saved Cities</h3>
                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                      {savedCities.map((savedCity) => (
                        <button
                          key={savedCity}
                          onClick={() => fetchWeather(savedCity)}
                          className="bg-white rounded-lg shadow-md p-3 hover:shadow-lg transition text-left"
                        >
                          <p className="font-semibold text-gray-800 truncate">{savedCity}</p>
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              removeFromSavedCities(savedCity);
                            }}
                            className="text-red-500 hover:text-red-700 text-sm mt-2"
                          >
                            Remove
                          </button>
                        </button>
                      ))}
                    </div>
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      );
    }

    // Initialize app
    async function initApp() {
      const React = await import('https://esm.sh/react@18.3.1').then(m => m.default);
      const { createRoot } = await import('https://esm.sh/react-dom@18.3.1/client').then(m => m);
      
      Object.assign(window, { React });
      
      const root = createRoot(document.getElementById('root'));
      root.render(React.createElement(WeatherDashboard));
    }

    initApp().catch(console.error);
  </script>
</body>
</html>
